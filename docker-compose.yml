services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DANDIYA_IMAGE:-dandiya-api:local}
    command: ["node", "dist/app/server.js"]
    restart: unless-stopped
    env_file: ./server/.env
    expose:
      - "3000"
    networks:
      - app
      - proxy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DANDIYA_IMAGE:-dandiya-api:local}
    command: ["node", "dist/jobs/email.worker.js"]
    restart: unless-stopped
    env_file: ./server/.env
    networks:
      - app
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('fs');const age=Date.now()-Number(fs.readFileSync('/tmp/dandiya-worker-heartbeat','utf8'));process.exit(age < 120000 ? 0 : 1)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  app:
    driver: bridge
  proxy:
    external: true
